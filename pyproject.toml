[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music_sync"
authors = [{"name" = "Lucas Chizzali"}]
description = "Syncing Apple Music Library to Spotify"
readme = "README.md"
# itertools.batched (music_sync.spotify.sync) requires 3.12
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "click~=8.1.7",
    "loguru~=0.7.3",
    "numpy~=1.26.3",
    "pandas~=2.1.4",
    "pydantic~=2.11.2",
    "pydantic-settings~=2.7",
    "rapidfuzz~=3.13.0",
    "requests~=2.31.0",
    "spotipy==2.23.0",
    "tqdm>=4.67.1",
]

[project.scripts]
music-sync = "music_sync.cli:main"
music-sync-parse-library = "music_sync.apple_music.cli:main"
music-sync-playlist = "music_sync.spotify.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "notebook",
    "pandas-stubs==2.3.3.260113",
    "pre-commit",
    "pytest",
    "ruff",
    "types-requests",
    "types-tqdm",
]

[tool.setuptools.dynamic]
version = {attr = "music_sync.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
warn_unused_ignores = true

# spotipy ships neither stubs nor a py.typed marker.
[[tool.mypy.overrides]]
module = ["spotipy.*"]
ignore_missing_imports = true

[tool.ruff]
extend-include = ["*.ipynb"]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "W605",   # pycodestyle: invalid-escape-sequence
    "S102",   # flake8-bandit: exec-builtin
    "INP",    # flake8-no-pep420
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "PGH",    # pygrep-hooks
    "PL",     # Pylint
    "NPY",    # NumPy-specific rules
    "RUF",    # Ruff-specific rules
]
ignore = [
    "NPY002", # numpy-legacy-random
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["INP001"]
"[!t][!e][!s][!t][!s]*/**" = ["PT"]
